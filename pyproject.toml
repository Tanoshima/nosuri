[project]
name = "nosuri"
version = "0.0.0"
description = "Open-data ingestion scripts for the nosuri map service"
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary",
    "requests",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "responses>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["nosuri"]

